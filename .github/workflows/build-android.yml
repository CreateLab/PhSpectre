name: Build — Android

# Build-only sanity check on every commit — no version stamping and no release. Versioned
# releases are published from release.yml, triggered by pushing a vX.Y.Z tag.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore PhSpectre.Android/PhSpectre.Android.csproj

      - name: Publish APK
        run: |
          dotnet publish PhSpectre.Android/PhSpectre.Android.csproj \
            -c Release \
            -f net10.0-android \
            -o publish/android
