name: Build — Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore PhSpectre.Android/PhSpectre.Android.csproj

      - name: Publish APK
        run: |
          dotnet publish PhSpectre.Android/PhSpectre.Android.csproj \
            -c Release \
            -f net10.0-android \
            -o publish/android

      - name: Rename APK
        run: |
          apk=$(find publish/android -name "*-Signed.apk" | head -n 1)
          mv "$apk" publish/android/PhSpectre-android.apk

      - name: Move release tag
        if: github.event_name == 'push'
        run: |
          git tag -f latest-android
          git push origin latest-android --force

      - name: Create or update release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android
          name: "Latest — Android APK"
          body: |
            Automated build · commit ${{ github.sha }}
          prerelease: true
          files: publish/android/PhSpectre-android.apk
