name: Release

# One tag = one release with all three platform artifacts, versioned from the tag itself.
# To ship a release: git tag vX.Y.Z && git push origin vX.Y.Z — everything else is automatic.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhSpectre.Desktop/PhSpectre.Desktop.csproj

      - name: Publish
        run: >-
          dotnet publish PhSpectre.Desktop/PhSpectre.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          -p:InformationalVersion=${{ env.VERSION }}+${{ github.sha }}
          -o publish/windows

      - name: Package
        run: Compress-Archive -Path publish/windows/PhSpectre.Desktop.exe -DestinationPath PhSpectre-${{ env.VERSION }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PhSpectre-${{ env.VERSION }}-windows-x64.zip

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhSpectre.Desktop/PhSpectre.Desktop.csproj

      - name: Publish
        run: |
          dotnet publish PhSpectre.Desktop/PhSpectre.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${VERSION} \
            -p:InformationalVersion=${VERSION}+${GITHUB_SHA} \
            -o publish/linux

      - name: Package
        run: |
          mv publish/linux/PhSpectre.Desktop publish/linux/PhSpectre-linux-x64
          tar -czf PhSpectre-${VERSION}-linux-x64.tar.gz -C publish/linux PhSpectre-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: PhSpectre-${{ env.VERSION }}-linux-x64.tar.gz

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhSpectre.Desktop/PhSpectre.Desktop.csproj

      - name: Publish
        run: |
          dotnet publish PhSpectre.Desktop/PhSpectre.Desktop.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${VERSION} \
            -p:InformationalVersion=${VERSION}+${GITHUB_SHA} \
            -o publish/macos

      - name: Build .app bundle
        run: |
          set -e
          APP=publish/macos/PhSpectre.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          mv publish/macos/PhSpectre.Desktop "$APP/Contents/MacOS/PhSpectre"
          chmod +x "$APP/Contents/MacOS/PhSpectre"

          # PhSpectre.Avalonia/Assets/Icon.png is gitignored (*.png) and only
          # ever existed on a local dev machine — never checked out on CI. Use
          # the Android app icon instead: it's explicitly un-ignored, tracked,
          # and a plain 432x432 truecolor+alpha PNG that sips reads natively.
          # sips/iconutil ship preinstalled on macOS runners — no extra deps.
          ICONSET=publish/macos/PhSpectre.iconset
          mkdir -p "$ICONSET"
          SRC=PhSpectre.Android/Icon.png
          for size in 16 32 128 256 512; do
            sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/PhSpectre.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>PhSpectre</string>
              <key>CFBundleDisplayName</key>
              <string>PhSpectre</string>
              <key>CFBundleIdentifier</key>
              <string>com.createlab.phspectre</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleExecutable</key>
              <string>PhSpectre</string>
              <key>CFBundleIconFile</key>
              <string>PhSpectre.icns</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          PLIST

          # Apple Silicon requires every executable to carry at least a
          # signature to run at all. Without one, Gatekeeper reports the
          # misleading "PhSpectre is damaged and can't be opened" instead of
          # the expected "unidentified developer" prompt. Ad-hoc signing (no
          # Apple Developer account, no cost) fixes that; it doesn't pass
          # notarization, so the unidentified-developer prompt (right-click →
          # Open, once) is still expected on first launch.
          codesign --force --deep -s - "$APP"

      - name: Package
        run: |
          # ditto (not zip) preserves the .app bundle structure correctly — the
          # standard way to zip an .app for distribution on macOS.
          ditto -c -k --sequesterRsrc --keepParent \
            publish/macos/PhSpectre.app \
            PhSpectre-${VERSION}-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: PhSpectre-${{ env.VERSION }}-macos-arm64.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore PhSpectre.Android/PhSpectre.Android.csproj

      - name: Publish APK
        run: |
          dotnet publish PhSpectre.Android/PhSpectre.Android.csproj \
            -c Release \
            -f net10.0-android \
            -p:Version=${VERSION} \
            -p:InformationalVersion=${VERSION}+${GITHUB_SHA} \
            -p:ApplicationDisplayVersion=${VERSION} \
            -p:ApplicationVersion=${GITHUB_RUN_NUMBER} \
            -o publish/android

      - name: Rename APK
        run: |
          apk=$(find publish/android -name "*-Signed.apk" | head -n 1)
          mv "$apk" PhSpectre-${VERSION}-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PhSpectre-${{ env.VERSION }}-android.apk

  release:
    needs: [version, windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PhSpectre ${{ needs.version.outputs.version }}"
          generate_release_notes: true
          prerelease: false
          files: dist/*
