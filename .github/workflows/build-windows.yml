name: Build — Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhSpectre.Desktop/PhSpectre.Desktop.csproj

      - name: Publish
        run: >-
          dotnet publish PhSpectre.Desktop/PhSpectre.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/windows

      - name: Move release tag
        if: github.event_name == 'push'
        run: |
          git tag -f latest-windows
          git push origin latest-windows --force

      - name: Remove stale release assets
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest-windows PhSpectre.App.exe --repo ${{ github.repository }} --yes

      - name: Create or update release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: "Latest — Windows x64"
          body: |
            Automated build · commit ${{ github.sha }}
          prerelease: true
          files: publish/windows/PhSpectre.Desktop.exe
