name: Build — Linux

# Build-only sanity check on every commit — no version stamping and no release. Versioned
# releases are published from release.yml, triggered by pushing a vX.Y.Z tag.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhSpectre.Desktop/PhSpectre.Desktop.csproj

      - name: Publish
        run: |
          dotnet publish PhSpectre.Desktop/PhSpectre.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/linux
