name: Build — Linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhSpectre.Desktop/PhSpectre.Desktop.csproj

      - name: Publish
        run: |
          dotnet publish PhSpectre.Desktop/PhSpectre.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/linux

      - name: Rename binary
        run: mv publish/linux/PhSpectre.Desktop publish/linux/PhSpectre-linux-x64

      - name: Move release tag
        if: github.event_name == 'push'
        run: |
          git tag -f latest-linux
          git push origin latest-linux --force

      - name: Create or update release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-linux
          name: "Latest — Linux x64"
          body: |
            Automated build · commit ${{ github.sha }}
          prerelease: true
          files: publish/linux/PhSpectre-linux-x64
